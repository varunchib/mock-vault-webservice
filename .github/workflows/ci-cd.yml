name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Test — runs on every push and PR to main ─────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # ── 2. Deploy — runs after merge into main ──────────────────────
  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/mockvault

            echo "==> pulling latest code"
            git pull origin main

            echo "==> building new image (old container keeps running)"
            docker compose build webservice

            echo "==> swapping backend"
            docker compose up -d --no-deps webservice

            echo "==> cleaning old images"
            docker image prune -f

            echo "==> done"
            docker compose ps
